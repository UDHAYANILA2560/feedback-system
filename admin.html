<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url("https://images.unsplash.com/photo-1540189549336-e6e99c3679fe");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0;
            padding: 0;
        }

        /* Table Container */
        .table-container {
            width: 80%;
            height: 800px;
            margin: 120px auto;   /* pushes box down */
            background: rgba(190, 169, 169, 0.95);
            padding: 60px 20px 20px 20px; /* space for heading */
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            position: relative;
        }

        /* Heading styled to appear inside box */
        h2 {
            position: absolute;
            top: 130px;   /* adjust to align inside */
            left: 50%;
            transform: translateX(-50%);
            color: #333;
            font-size: 26px;
            font-weight: bold;
            margin: 0;
            z-index: 2;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        /* Header */
        th {
            background: #ff6b35;
            color: white;
            padding: 12px;
        }

        /* Table Data */
        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        /* Row Hover */
        tr:hover {
            background-color: #fff3e6;
        }

        /* Sentiment */
        td:last-child {
            font-weight: bold;
        }
    .logout-btn {
    position: absolute;
    top: 20px;
    right: 30px;
    padding: 10px 18px;
    background: #b76111;   
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-style: normal;
    transition: 0.3s;
}

.logout-btn:hover {
    background: #5a6268;
}
    </style>
</head>

<body>

    <h2>🍔 Admin Dashboard - All Feedbacks</h2>
    <a href="/logout">
    <button class="logout-btn">Logout</button>
</a>

    <div class="table-container">
        <table>
            <tr>
            
                <th>Feedback</th>
                <th>Sentiment</th>
                <th>Suggestion</th>
            </tr>

            {% for f in feedbacks %}
            <tr>
        
                <td>{{ f[1] }}</td>
                <td>{{ f[2] }}</td>
                <td>{{ f[3] if f[3] else "No Suggestion"}}</td>
             </tr>
            {% endfor %}
        </table>
    </div>

</body>
</html>
