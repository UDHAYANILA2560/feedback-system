<!DOCTYPE html>
<html>
<head>
<title>Sentiment Result</title>

<style>

body{
    font-family: 'Segoe UI', cursive;
    background: url("https://images.unsplash.com/photo-1589302168068-964664d93dc0") no-repeat center center/cover;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0;
}

/* Result Box */

.result-box{
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(8px);
    padding:40px;
    border-radius:15px;
    text-align:center;
    width:420px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* Heading */

h2{
    color:#e67e22;
    margin-bottom:20px;
}

/* Sentiment Colors */

.positive{
    color:#27ae60;
    font-weight:bold;
    font-size:24px;
}

.negative{
    color:#e74c3c;
    font-weight:bold;
    font-size:24px;
}

.neutral{
    color:#f39c12;
    font-weight:bold;
    font-size:24px;
}

/* Star Rating */

.stars{
    font-size:30px;
    margin-top:15px;
}

/* Thank You Message */

.thankyou{
    margin-top:25px;
    font-size:20px;
    color:#444;
    font-family: "Comic Sans MS", cursive;
}

.food{
    font-size:26px;
}

</style>
</head>

<body>

<div class="result-box">

<h2>🍽 Feedback Submitted</h2>

{% if "Positive" in sentiment %}

<p class="positive">{{ sentiment }}</p>

<div class="stars">
⭐ ⭐ ⭐ ⭐ ⭐
</div>

<div class="food">🍛 🥥 🥞</div>

{% elif "Negative" in sentiment %}

<p class="negative">{{ sentiment }}</p>

<div class="stars">
⭐ ⭐
</div>

<div class="food">😕</div>

{% else %}

<p class="neutral">{{ sentiment }}</p>

<div class="stars">
⭐ ⭐ ⭐
</div>

<div class="food">🍲</div>

{% endif %}

<p class="thankyou">💛 Thank you for sharing your feedback!</p>

</div>

</body>
</html>
