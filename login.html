<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background: url("https://images.pexels.com/photos/1640777/pexels-photo-1640777.jpeg?auto=compress&cs=tinysrgb&w=1260") no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Login Box */
        .login-box{
            background: rgba(255,255,255,0.9);
            padding: 35px;
            border-radius: 12px;
            width: 320px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        /* Title */
        h2{
            color: #e67e22;
            margin-bottom: 20px;
        }

        /* Input Fields */
        input[type="text"],
        input[type="password"]{
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        /* Submit Button */
        input[type="submit"]{
            width: 100%;
            padding: 10px;
            background: #ff6b35;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        input[type="submit"]:hover{
            background: #e85d04;
        }

        /* Admin Button */
        #adminDashboardBtn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #5a8dee, #3d6fd6);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
    transition: all 0.3s ease;
}

#adminDashboardBtn:hover {
    background: linear-gradient(135deg, #3d6fd6, #2c5ac4);
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

#adminDashboardBtn:active {
    transform: scale(0.98);
}
    </style>
</head>
<body>

    <div class="login-box">
        <h2>🍽 Student Login</h2>
        <form method="POST" action="/">
            <label>Register No:</label>
            <input type="text" name="student_id" required>

            <label>Password:</label>
            <input type="password" name="password" required>

            <input type="submit" value="Login">
        </form>
    <button id="adminDashboardBtn" onclick="window.location.href='/admin'">
    Admin Dashboard
</button>
    </div>

</body>
</html>
