<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>

    <style>
        /* Background Image */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;

            background-image: url("https://images.unsplash.com/photo-1504674900247-0877df9cc836");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Login Box */
        form {
    background: rgba(255, 255, 255, 0.9);
    padding: 60px 30px 30px 30px; /* space for heading */
    border-radius: 16px;
    width: 350px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    text-align: center;
    position: relative;
    z-index: 1;
}
    h2 {
    position: absolute;
    top: 35%;              /* INSIDE the box */
    left: 43%;
    transform: translateX(-50%, -180px);
    margin: 0;

    color: #333;
    font-size: 24px;
    font-weight: bold;
    z-index: 2;

}

        /* Inputs */
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;

            border: 1px solid #ccc;
            border-radius: 6px;
        }

        /* Button */
        button {
            width: 100%;
            padding: 10px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #e85d04;
        }

        /* Error message */
        p {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h2>🔐 Admin Login</h2>

<form method="POST">
    <input type="text" name="username" placeholder="Admin Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Login</button>
</form>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

</body>
</html>
