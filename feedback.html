<!DOCTYPE html>
<html>
<head>
<title>Feedback</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: url("https://images.unsplash.com/photo-1490818387583-1baba5e638af") no-repeat center center/cover;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
}

/* Feedback Box */
.feedback-box{
    background: rgba(255,255,255,0.9);
    padding: 35px;
    border-radius: 12px;
    width: 380px;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

/* Title */
h2{
    color: #ff6b35;
    margin-bottom: 20px;
}

/* Textarea */
textarea{
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    resize: none;
    font-size: 14px;
}

/* Submit Button */
input[type="submit"]{
    margin-top: 15px;
    width: 100%;
    padding: 10px;
    background: #ff6b35;
    border: none;
    color: white;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
}

input[type="submit"]:hover{
    background: #e85d04;
}

</style>
</head>

<body>

<div class="feedback-box">
<h2>🍔 Submit Your Feedback</h2>

<form method="POST">
Feedback:<br><br>
<textarea name="feedback" rows="5" required></textarea><br><br>
<!-- Suggestion Field -->
        Suggestion (Optional):<br><br>
        <textarea name="suggestion" rows="3"></textarea><br><br>

<input type="submit" value="Submit">
</form>

</div>

</body>
</html>
